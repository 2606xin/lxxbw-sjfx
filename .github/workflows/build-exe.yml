name: 打包 Windows exe

# 两种触发方式：
# 1. 手动触发（网页上点 Run workflow）
# 2. push 代码到 main 分支且 app/ 有改动时自动打包
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - '.github/workflows/build-exe.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11 (x64)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: 'pip'
          cache-dependency-path: app/requirements.txt

      - name: 安装依赖
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 代码自检
        working-directory: app
        run: python -c "import sys; sys.path.insert(0, '.'); from api import Api; print('核心模块导入正常')"

      - name: PyInstaller 打包
        working-directory: app
        run: python -m PyInstaller --clean -y 工单分析工具.spec

      - name: 校验产物
        working-directory: app
        shell: pwsh
        run: |
          if (-Not (Test-Path "dist/梁溪区工单分析工具.exe")) {
            Write-Error "未找到产物 exe"; exit 1
          }
          Write-Host "exe 大小: $((Get-Item 'dist/梁溪区工单分析工具.exe').Length / 1MB) MB"

      - name: 上传 exe 产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: app/dist/梁溪区工单分析工具.exe
          if-no-files-found: error
          retention-days: 30
